# Blueprint Render — « MonRéseau »
# Déployer : Render dashboard → New + → Blueprint → sélectionner ce dépôt.
# Render crée alors la base PostgreSQL puis le service web, et lance le
# premier déploiement automatiquement.

databases:
  - name: monreseau-db
    plan: free

services:
  - type: web
    name: monreseau
    runtime: python
    plan: free
    buildCommand: bash build.sh
    startCommand: gunicorn social_network.wsgi
    envVars:
      - key: DJANGO_SETTINGS_MODULE
        value: social_network.settings.prod
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: monreseau-db
          property: connectionString
