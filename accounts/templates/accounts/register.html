{% extends 'base.html' %}

{% block title %}Inscription{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6 col-lg-5">
        <div class="card shadow-sm">
            <div class="card-body">
                <h3 class="card-title text-center mb-4">Créer un compte</h3>
                <form method="post">
                    {% csrf_token %}
                    {% include '_form_fields.html' %}
                    <button type="submit" class="btn btn-primary w-100 mt-2">S'inscrire</button>
                </form>
                <p class="text-center mt-3 mb-0">
                    Déjà membre ? <a href="{% url 'login' %}">Connecte-toi</a>
                </p>
            </div>
        </div>
    </div>
</div>
{% endblock %}
