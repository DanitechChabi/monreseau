{% extends 'base.html' %}

{% block title %}Modifier le profil{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-lg-7">
        <div class="card shadow-sm">
            <div class="card-body">
                <h3 class="card-title mb-4">Modifier le profil</h3>
                <form method="post" enctype="multipart/form-data">
                    {% csrf_token %}
                    <h6 class="text-primary">Compte</h6>
                    {% include '_form_fields.html' with form=form %}
                    <hr>
                    <h6 class="text-primary">Profil public</h6>
                    {% include '_form_fields.html' with form=profile_form %}
                    <button type="submit" class="btn btn-primary w-100 mt-2">Enregistrer</button>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
