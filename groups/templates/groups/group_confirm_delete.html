{% extends 'base.html' %}

{% block title %}Supprimer le groupe{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-lg-6">
        <div class="card shadow-sm">
            <div class="card-body text-center">
                <h3 class="mb-3">Supprimer le groupe « {{ group.name }} » ?</h3>
                <p class="text-muted">
                    Toutes les publications du groupe seront également supprimées.
                    Cette action est irréversible.
                </p>
                <form method="post">
                    {% csrf_token %}
                    <button type="submit" class="btn btn-danger"><i class="bi bi-trash"></i> Oui, supprimer</button>
                    <a href="{% url 'group_detail' group.pk %}" class="btn btn-outline-secondary">Annuler</a>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
