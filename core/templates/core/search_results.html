{% extends 'base.html' %}

{% block title %}Recherche{% endblock %}

{% block content %}
<div class="card shadow-sm">
    <div class="card-body text-center py-5">
        <i class="bi bi-search display-3 text-primary"></i>
        <h3 class="mt-3">Recherche de personnes</h3>
        {% if q %}
            <p class="text-muted">Résultats pour « {{ q }} » — bientôt disponibles.</p>
        {% else %}
            <p class="text-muted">Tape un nom ou un pseudo pour chercher des personnes.</p>
        {% endif %}
    </div>
</div>
{% endblock %}
